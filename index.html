<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <title>المحاسبة اليومية - المطعم</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- رأس التطبيق -->
  <header class="app-header">
    <h1 class="app-header__title">المحاسبة اليومية</h1>
  </header>

  <!-- المحتوى الرئيسي: يُبنى ديناميكيًا بواسطة js/app.js -->
  <main id="app" class="app-main"></main>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav__item bottom-nav__item--active" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      الرئيسية
    </button>
    <button class="bottom-nav__item" data-route="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      الحسابات
    </button>
    <button class="bottom-nav__item" data-route="employees">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      الموظفون
    </button>
    <button class="bottom-nav__item" data-route="drivers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      السائقون
    </button>
    <button class="bottom-nav__item" data-route="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      التقارير
    </button>
    <button class="bottom-nav__item" data-route="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      المزيد
    </button>
  </nav>

  <!-- مكتبات خارجية (مُضمَّنة محليًا بالكامل، لا تعتمد على أي شبكة) -->
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/vendor/arabic-font-regular-data.js"></script>
  <script src="js/vendor/arabic-font-bold-data.js"></script>
  <script src="js/vendor/logo-data.js"></script>

  <!-- تحميل الوحدات بالترتيب الصحيح للاعتمادية -->
  <script src="js/storage.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/arabicText.js"></script>
  <script src="js/pdfText.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
